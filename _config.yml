# Site configuration for the Chirpy theme
# Docs: https://github.com/cotes2020/jekyll-theme-chirpy/wiki
# Production build: bundle exec jekyll build   (JEKYLL_ENV=production)
# Local Docker build: bundle exec jekyll build --config _config.yml,_config.local.yml

theme: jekyll-theme-chirpy

lang: en
timezone: America/Los_Angeles

title: Karthik Balasubramanian
tagline: >-
  ML Inference & GPU Systems Engineer: making LLMs fast, observable, and reliable in production.
description: >-
  Karthik Balasubramanian writes about LLM inference engineering and GPU kernels:
  Triton and CUDA, attention, KV cache, vLLM and SGLang serving, benchmarking and observability.

# Production URL. Overridden only by _config.local.yml for local Docker builds.
url: "https://karthikbalasubramanian.github.io"
baseurl: ""

github:
  username: karthikBalasubramanian

# twitter:
#   username: # pending: add an X/Twitter handle if you want one linked

social:
  name: Karthik Balasubramanian
  email: # intentionally left blank so no address is published; add one if you want an email link
  links:
    - https://github.com/karthikBalasubramanian
    - https://www.linkedin.com/in/bks4line

# Search engine verification (pending: paste codes from Google Search Console / Bing Webmaster Tools)
webmaster_verifications:
  google:
  bing:

# Analytics. The old Universal Analytics tag (UA-135003839-1) was removed: UA stopped collecting data in 2023.
analytics:
  google:
    id: # pending GA4 measurement ID, e.g. G-XXXXXXXXXX
  goatcounter:
    id:

pageviews:
  provider:

# Leave empty so the site follows the visitor's OS preference and the toggle in the sidebar.
# Chirpy stores the visitor's choice in localStorage key "theme" ("light" | "dark");
# the /tools/ microsites read the same key so they match the blog.
theme_mode:

cdn:

# Pending: add the headshot at assets/img/avatar.jpg (square, >= 400x400).
avatar: /assets/img/avatar.jpg

# Pending: default 1200x630 social preview image, e.g. /assets/img/og-default.png
social_preview_image:

toc: true

actions:
  edit_post:
    enabled: false
    url: "https://github.com/karthikBalasubramanian/karthikBalasubramanian.github.io/edit/master"

comments:
  # Disqus was removed for page weight. To re-enable comments, giscus (GitHub Discussions) is recommended.
  provider:

assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true
  cache:
    enabled: true
    # Do not let the blog's service worker cache the React microsites.
    deny_paths:
      - /child-financial-investment-planner/
      - /paycheck-tax-investment-allocator/
      - /rent-vs-buy-house-poor-calculator/
      - /rsu-hold-vs-sell-simulator/

paginate: 10

kramdown:
  input: GFM
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      # New posts get clean URLs. Older posts set an explicit `permalink:`
      # in front matter so their /ml/YYYY/MM/DD/slug.html URLs don't change.
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

plugins:
  - jekyll-redirect-from

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools/test.sh
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - Makefile
  - Dockerfile.local
  - docker-compose.yml
  - git_find_big.sh
  - shared
  - vendor
  - "*.config.js"
  - "package*.json"
  # React/Vite microsites are built separately by npm and copied into _site afterwards.
  - child-financial-investment-planner
  - paycheck-tax-investment-allocator
  - rent-vs-buy-house-poor-calculator
  - rsu-hold-vs-sell-simulator

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
