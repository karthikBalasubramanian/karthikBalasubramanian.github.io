<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- site-chrome: set light/dark before first paint (same localStorage key as the blog's Chirpy theme) -->
    <script>
      (function () {
        var m = null;
        try { m = localStorage.getItem('theme'); } catch (e) {}
        if (m !== 'light' && m !== 'dark') {
          m = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-bs-theme', m);
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310b981'><path d='M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSU Hold vs. Sell Strategy Simulator & Game | Lifestyle & Wealth Planner</title>
    <meta name="description" content="Simulate Restricted Stock Unit (RSU) vesting strategies. Compare holding company stock vs divesting into S&P 500, Nasdaq, and Sector ETFs. Behavioral finance regret minimization game for public company employees." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>

  </body>
</html>
