name: Deploy to GitHub Pages

on:
  push:
    branches: ['master', 'main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect Directory & Install Dependencies
        run: |
          if [ -d "child-financial-investment-planner" ]; then
            echo "Building inside child-financial-investment-planner subdirectory"
            cd child-financial-investment-planner
          fi
          npm ci || npm install

      - name: Build static site
        run: |
          if [ -d "child-financial-investment-planner" ]; then
            echo "Building subfolder app..."
            cd child-financial-investment-planner
            npm ci || npm install
            npm run build
            touch dist/.nojekyll
            # Copy compiled dist files into the subfolder so GitHub Pages serves compiled assets
            cp -r dist/* .
            touch .nojekyll
            cd ..
          else
            npm ci || npm install
            npm run build
            touch dist/.nojekyll
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
