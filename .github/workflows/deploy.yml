name: Deploy to GitHub Pages

on:
  push:
    branches: ['master', 'main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Jekyll Root Site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Discover & Build All Microsites into Jekyll Site
        run: |
          sudo chown -R $USER:$USER ./_site
          touch ./_site/.nojekyll

          find . -maxdepth 2 -name "package.json" -not -path "*/node_modules/*" -not -path "*/bower_components/*" -not -path "./package.json" | while read -r pkg; do
            dir=$(dirname "$pkg" | sed 's|^\./||')
            echo "=========================================="
            echo "Found microsite directory: $dir"
            echo "=========================================="

            (
              cd "$dir"
              echo "Installing dependencies in $dir..."
              npm ci || npm install
              echo "Building $dir..."
              npm run build
            )

            if [ -d "$dir/dist" ]; then
              echo "Copying compiled output for $dir into _site/$dir..."
              mkdir -p "./_site/$dir"
              cp -r "$dir/dist/"* "./_site/$dir/"
              touch "./_site/$dir/.nojekyll"
              echo "Successfully integrated $dir into _site/$dir"
            else
              echo "Warning: No dist directory found for $dir after build."
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
