name: Deploy to GitHub Pages

on:
  push:
    branches: ['master', 'main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Vite App (Child Planner)
        run: |
          if [ -d "child-financial-investment-planner" ]; then
            cd child-financial-investment-planner
            npm ci || npm install
            npm run build
          fi

      - name: Build Jekyll Root Site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Copy Vite App into Jekyll Site
        run: |
          if [ -d "child-financial-investment-planner/dist" ]; then
            mkdir -p ./_site/child-financial-investment-planner
            cp -r ./child-financial-investment-planner/dist/* ./_site/child-financial-investment-planner/
            touch ./_site/child-financial-investment-planner/.nojekyll
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4