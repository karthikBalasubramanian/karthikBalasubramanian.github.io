<!doctype html>
<html lang="en">
  <head>
    <!-- site-chrome: set light/dark before first paint (same localStorage key as the blog's Chirpy theme) -->
    <script>
      (function () {
        var m = null;
        try { m = localStorage.getItem('theme'); } catch (e) {}
        if (m !== 'light' && m !== 'dark') {
          m = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-bs-theme', m);
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/rent-vs-buy-house-poor-calculator/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rent vs Buy & House Poor Stress Tester | Step 2</title>
    <meta name="description" content="Calculate your true monthly net disposable income and determine if buying a home vs renting will make you House Poor in your target ZIP Code." />
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
